<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PromptVault — Private AI Prompt Manager</title>
  <meta name="theme-color" content="#0B0C0E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; margin: 0; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(120, 125, 140, 0.3); border-radius: 999px; }
  </style>
</head>
<body class="bg-[#0B0C0E] text-zinc-100 antialiased selection:bg-[#5E6AD2]/30">
  <div id="app"></div>

  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const state = {
      darkMode: localStorage.getItem('pv_theme') !== 'light',
      user: JSON.parse(localStorage.getItem('pv_user') || 'null'),
      folders: JSON.parse(localStorage.getItem('pv_folders') || 'null') || [
        { id: 'f-general', name: 'General', color: '#5E6AD2' }
      ],
      prompts: JSON.parse(localStorage.getItem('pv_prompts') || 'null') || [],
      apiKeys: JSON.parse(localStorage.getItem('pv_apikeys') || '{"openai":"","anthropic":"","gemini":"","provider":"gemini"}'),
      activeView: 'all',
      selectedPromptId: null,
      mobileTab: 'list',
      searchQuery: '',
      varValues: {},
      modal: null,
      aiInput: '',
      aiOutput: '',
      aiLoading: false,
      aiError: ''
    };

    if (state.prompts.length > 0 && !state.selectedPromptId) {
      state.selectedPromptId = state.prompts[0].id;
    }

    function save() {
      localStorage.setItem('pv_theme', state.darkMode ? 'dark' : 'light');
      localStorage.setItem('pv_user', JSON.stringify(state.user));
      localStorage.setItem('pv_folders', JSON.stringify(state.folders));
      localStorage.setItem('pv_prompts', JSON.stringify(state.prompts));
      localStorage.setItem('pv_apikeys', JSON.stringify(state.apiKeys));
    }

    function notify(msg) {
      const el = document.createElement('div');
      el.className = 'fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-xl bg-[#5E6AD2] text-white text-xs font-medium shadow-xl';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    function esc(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getActivePrompt() {
      return state.prompts.find(p => p.id === state.selectedPromptId) || null;
    }

    function getVariables(text) {
      const matches = (text || '').match(/\{\{([^}]+)\}\}/g) || [];
      return [...new Set(matches.map(m => m.slice(2, -2).trim()).filter(Boolean))];
    }

    function compilePrompt(prompt) {
      if (!prompt) return '';
      let out = prompt.content;
      getVariables(prompt.content).forEach(v => {
        const val = state.varValues[v];
        if (val && val.trim()) {
          const safe = v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          out = out.replace(new RegExp('\\{\\{\\s*' + safe + '\\s*\\}\\}', 'g'), val);
        }
      });
      if (prompt.attachments && prompt.attachments.length > 0) {
        const attTexts = prompt.attachments.map(a => `--- Attached File: ${a.name} ---\n${a.extractedText || '[No extracted text]'}`).join('\n\n');
        if (attTexts) {
          out += '\n\n' + attTexts;
        }
      }
      return out;
    }

    async function copyText(text, label = 'Copied full prompt to clipboard') {
      try {
        await navigator.clipboard.writeText(text);
        notify(label);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        notify(label);
      }
    }

    function render() {
      document.documentElement.classList.toggle('dark', state.darkMode);
      const app = document.getElementById('app');
      const d = state.darkMode;

      if (!state.user) {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 ${d ? 'bg-[#0B0C0E] text-zinc-100' : 'bg-[#F4F4F5] text-zinc-900'}">
            <div class="w-full max-w-md rounded-2xl border p-7 shadow-2xl ${d ? 'bg-[#101114] border-[#242731]' : 'bg-white border-zinc-200'}">
              <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-[#5E6AD2] flex items-center justify-center text-white font-bold">PV</div>
                <div>
                  <h1 class="text-lg font-semibold">PromptVault</h1>
                  <p class="text-xs text-zinc-500">Private AI Prompt Vault</p>
                </div>
              </div>
              <form id="login-form" class="space-y-4">
                <div>
                  <label class="block text-xs font-medium text-zinc-500 mb-1">Vault / Workspace Name</label>
                  <input id="login-name" type="text" placeholder="My Personal Vault" class="w-full px-3.5 py-2.5 rounded-lg border text-sm outline-none ${d ? 'bg-[#16181D] border-[#242731] text-zinc-100 placeholder-zinc-600' : 'bg-zinc-50 border-zinc-300 text-zinc-900 placeholder-zinc-400'}" />
                </div>
                <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-[#5E6AD2] hover:bg-[#6E79E0] text-white font-medium text-sm transition">
                  Enter Vault
                </button>
              </form>
            </div>
          </div>`;
        document.getElementById('login-form').onsubmit = (e) => {
          e.preventDefault();
          const name = document.getElementById('login-name').value.trim() || 'My Vault';
          state.user = { name };
          save();
          render();
        };
        return;
      }

      const filtered = state.prompts.filter(p => {
        if (state.activeView === 'favorites' && !p.favorite) return false;
        if (state.activeView !== 'all' && state.activeView !== 'favorites' && p.folderId !== state.activeView) return false;
        if (state.searchQuery.trim()) {
          const q = state.searchQuery.toLowerCase();
          return (p.title || '').toLowerCase().includes(q) || (p.content || '').toLowerCase().includes(q);
        }
        return true;
      });

      const active = getActivePrompt();
      const vars = active ? getVariables(active.content) : [];
      const compiled = compilePrompt(active);

      app.innerHTML = `
        <div class="h-screen w-screen flex flex-col md:flex-row overflow-hidden ${d ? 'bg-[#0B0C0E] text-zinc-100' : 'bg-[#F4F4F5] text-zinc-900'}">
          
          <div class="md:hidden flex items-center justify-between px-4 py-3 border-b ${d ? 'bg-[#101114] border-[#242731]' : 'bg-white border-zinc-200'}">
            <div class="flex items-center gap-2 min-w-0">
              <button id="btn-mob-menu" class="p-1.5 rounded-lg border ${d ? 'border-[#242731] text-zinc-300' : 'border-zinc-300 text-zinc-700'}">
                <i data-lucide="menu" class="w-4 h-4"></i>
              </button>
              <span class="font-semibold text-sm truncate max-w-[150px]">${esc(state.user.name)}</span>
            </div>
            <div class="flex items-center gap-2">
              <button id="btn-mob-ai" class="px-2.5 py-1.5 rounded-lg bg-[#5E6AD2] text-white text-xs font-medium">AI</button>
              <button id="btn-mob-new" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-medium">+ New</button>
            </div>
          </div>

          <aside class="${state.mobileTab === 'sidebar' ? 'flex fixed inset-0 z-40' : 'hidden'} md:flex md:static w-full md:w-64 flex-col border-r shrink-0 ${d ? 'bg-[#101114] border-[#242731]' : 'bg-[#EAEAE6] border-zinc-300'}">
            <div class="p-4 flex items-center justify-between border-b ${d ? 'border-[#242731]' : 'border-zinc-300'}">
              <div class="flex items-center gap-2 min-w-0">
                <div class="w-7 h-7 rounded-lg bg-[#5E6AD2] flex items-center justify-center text-white text-xs font-bold shrink-0">PV</div>
                <div class="min-w-0 flex items-center gap-1.5">
                  <span id="vault-name-display" class="text-xs font-semibold truncate cursor-pointer hover:text-[#5E6AD2]" title="Click to edit">${esc(state.user.name)}</span>
                  <button id="btn-edit-vault" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 shrink-0" title="Edit name"><i data-lucide="pencil" class="w-3 h-3"></i></button>
                </div>
              </div>
              <div class="flex items-center gap-1">
                <button id="btn-theme" class="p-1.5 rounded-lg hover:bg-zinc-500/20 text-zinc-600 dark:text-zinc-300" title="Toggle theme">
                  <i data-lucide="${d ? 'sun' : 'moon'}" class="w-4 h-4"></i>
                </button>
                <button id="btn-close-sidebar" class="md:hidden p-1.5 rounded-lg text-zinc-600 dark:text-zinc-300">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <nav class="p-2 space-y-1">
              <button data-view="all" class="nav-view w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium ${state.activeView === 'all' ? 'bg-[#5E6AD2]/15 text-[#5E6AD2]' : 'text-zinc-600 dark:text-zinc-400 hover:bg-zinc-500/10'}">
                <span>All Prompts</span>
                <span>${state.prompts.length}</span>
              </button>
              <button data-view="favorites" class="nav-view w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium ${state.activeView === 'favorites' ? 'bg-[#5E6AD2]/15 text-[#5E6AD2]' : 'text-zinc-600 dark:text-zinc-400 hover:bg-zinc-500/10'}">
                <span>Favorites</span>
                <span>${state.prompts.filter(p => p.favorite).length}</span>
              </button>
            </nav>

            <div class="px-4 pt-3 pb-1 flex items-center justify-between">
              <span class="text-[10px] font-semibold uppercase tracking-wider text-zinc-500">Folders</span>
              <button id="btn-add-folder" class="text-xs text-[#5E6AD2] font-medium hover:underline">+ Folder</button>
            </div>

            <div class="flex-1 overflow-y-auto px-2 space-y-1">
              ${state.folders.map(f => `
                <div data-view="${f.id}" class="nav-view flex items-center justify-between px-3 py-2 rounded-lg text-xs cursor-pointer ${state.activeView === f.id ? 'bg-[#5E6AD2]/15 text-[#5E6AD2] font-medium' : 'text-zinc-600 dark:text-zinc-400 hover:bg-zinc-500/10'}">
                  <span class="flex items-center gap-2 truncate">
                    <span class="w-2 h-2 rounded-full" style="background:${f.color}"></span>
                    ${esc(f.name)}
                  </span>
                  <span class="text-[10px] opacity-60">${state.prompts.filter(p => p.folderId === f.id).length}</span>
                </div>
              `).join('')}
            </div>

            <div class="p-3 border-t ${d ? 'border-[#242731]' : 'border-zinc-300'} space-y-1.5">
              <button id="btn-open-ai" class="w-full py-2 px-3 rounded-lg bg-[#5E6AD2] text-white text-xs font-medium flex items-center justify-center gap-1.5 shadow-sm">
                <i data-lucide="wand-2" class="w-3.5 h-3.5"></i> AI Prompt Assistant
              </button>
              <button id="btn-open-backup" class="w-full py-2 px-3 rounded-lg border text-xs flex items-center justify-center gap-1.5 transition ${d ? 'border-[#242731] text-zinc-300 hover:bg-zinc-800' : 'border-zinc-300 text-zinc-700 hover:bg-zinc-200'}">
                Import / Export
              </button>
              <button id="btn-open-settings" class="w-full py-2 px-3 rounded-lg border text-xs flex items-center justify-center gap-1.5 transition ${d ? 'border-[#242731] text-zinc-300 hover:bg-zinc-800' : 'border-zinc-300 text-zinc-700 hover:bg-zinc-200'}">
                Configure API Keys
              </button>
            </div>
          </aside>

          <section class="${state.mobileTab === 'list' ? 'flex' : 'hidden'} md:flex w-full md:w-80 flex-col border-r shrink-0 flex-1 md:flex-initial overflow-hidden ${d ? 'bg-[#0B0C0E] border-[#242731]' : 'bg-white border-zinc-300'}">
            <div class="p-3 border-b ${d ? 'border-[#242731]' : 'border-zinc-300'} flex items-center justify-between gap-2">
              <input id="search-input" type="text" value="${esc(state.searchQuery)}" placeholder="Search prompts..." class="w-full px-3 py-1.5 rounded-lg border text-xs outline-none ${d ? 'bg-[#16181D] border-[#242731] text-zinc-100 placeholder-zinc-600' : 'bg-zinc-100 border-zinc-300 text-zinc-900 placeholder-zinc-400'}" />
              <button id="btn-new-prompt" class="hidden md:flex px-3 py-1.5 rounded-lg bg-[#5E6AD2] text-white text-xs font-medium shrink-0">+ New</button>
            </div>
            <div class="flex-1 overflow-y-auto p-2.5 space-y-2">
              ${filtered.length === 0 ? `
                <div class="text-center py-16 px-4 text-zinc-500 text-xs">
                  No prompts yet.<br>Create your first prompt using the button above.
                </div>
              ` : filtered.map(p => `
                <div data-pid="${p.id}" class="prompt-card p-3 rounded-xl border cursor-pointer transition ${p.id === state.selectedPromptId ? 'border-[#5E6AD2] bg-[#5E6AD2]/10 shadow-sm' : (d ? 'border-[#242731] bg-[#101114] hover:bg-zinc-900' : 'border-zinc-200 bg-zinc-50 hover:bg-zinc-100')}">
                  <div class="flex items-center justify-between gap-2 mb-1">
                    <h3 class="text-xs font-semibold truncate ${d ? 'text-zinc-100' : 'text-zinc-900'}">${esc(p.title || 'Untitled')}</h3>
                    <button data-fav="${p.id}" class="btn-fav text-xs ${p.favorite ? 'text-amber-400' : 'text-zinc-400 hover:text-zinc-600'}">★</button>
                  </div>
                  <p class="text-[11px] text-zinc-500 line-clamp-2">${esc(p.content || 'Empty prompt...')}</p>
                </div>
              `).join('')}
            </div>
          </section>

          <main class="${state.mobileTab === 'editor' ? 'flex' : 'hidden'} md:flex flex-1 flex-col min-w-0 overflow-hidden ${d ? 'bg-[#0B0C0E]' : 'bg-[#FAFAFA]'}">
            ${active ? `
              <div class="px-4 py-3 border-b flex flex-wrap items-center justify-between gap-2 ${d ? 'border-[#242731]' : 'border-zinc-300'}">
                <div class="flex items-center gap-2">
                  <button id="btn-back-list" class="md:hidden px-2.5 py-1.5 rounded-lg border text-xs ${d ? 'border-[#242731] text-zinc-300' : 'border-zinc-300 text-zinc-700'}">← Back</button>
                  <select id="edit-folder" class="px-2.5 py-1.5 rounded-lg border text-xs outline-none ${d ? 'bg-[#16181D] border-[#242731] text-zinc-100' : 'bg-white border-zinc-300 text-zinc-900'}">
                    ${state.folders.map(f => `<option value="${f.id}" ${f.id === active.folderId ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}
                  </select>
                </div>
                <div class="flex items-center gap-2">
                  <button id="btn-copy-final" class="px-3 py-1.5 rounded-lg bg-[#5E6AD2] hover:bg-[#6E79E0] text-white text-xs font-medium flex items-center gap-1.5 shadow-sm transition">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy prompt (with files & text)
                  </button>
                  <button id="btn-delete-prompt" class="px-2.5 py-1.5 rounded-lg text-red-500 hover:bg-red-500/10 text-xs transition">Delete</button>
                </div>
              </div>

              <div class="flex-1 overflow-y-auto p-4 md:p-7 space-y-5">
                <input id="edit-title" type="text" value="${esc(active.title)}" placeholder="Prompt title..." class="w-full text-lg md:text-2xl font-bold bg-transparent outline-none ${d ? 'text-zinc-100 placeholder-zinc-600' : 'text-zinc-900 placeholder-zinc-400'}" />

                ${vars.length > 0 ? `
                  <div class="p-4 rounded-xl border ${d ? 'bg-[#101114] border-[#242731]' : 'bg-white border-zinc-300 shadow-sm'}">
                    <div class="text-xs font-semibold text-[#5E6AD2] mb-2.5">Detected Variables (${vars.length})</div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      ${vars.map(v => `
                        <div>
                          <label class="block text-[11px] font-mono text-zinc-400 mb-1">{{${esc(v)}}}</label>
                          <input data-var="${esc(v)}" type="text" value="${esc(state.varValues[v] || '')}" placeholder="Value..." class="var-input w-full px-2.5 py-1.5 rounded-lg border text-xs outline-none ${d ? 'bg-[#16181D] border-[#242731] text-zinc-100 placeholder-zinc-600' : 'bg-zinc-50 border-zinc-300 text-zinc-900 placeholder-zinc-400'}" />
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}

                <div>
                  <label class="block text-[11px] uppercase tracking-wider text-zinc-500 mb-1.5 font-medium">Prompt Content (write freely and use {{variable}} if desired)</label>
                  <textarea id="edit-content" rows="10" placeholder="Type your prompt here..." class="w-full p-3.5 rounded-xl border font-mono text-xs leading-relaxed outline-none shadow-inner ${d ? 'bg-[#101114] border-[#242731] text-zinc-100 placeholder-zinc-600' : 'bg-white border-zinc-300 text-zinc-900 placeholder-zinc-400'}">${esc(active.content)}</textarea>
                </div>

                ${(vars.length > 0 || (active.attachments && active.attachments.length > 0)) ? `
                  <div>
                    <label class="block text-[11px] uppercase tracking-wider text-[#5E6AD2] mb-1.5 font-medium">Final Preview (everything will be copied to clipboard)</label>
                    <pre id="compiled-preview" class="p-3.5 rounded-xl border font-mono text-xs whitespace-pre-wrap ${d ? 'bg-[#16181D] border-[#242731] text-zinc-200' : 'bg-white border-zinc-300 text-zinc-800 shadow-sm'}">${esc(compiled)}</pre>
                  </div>
                ` : ''}

                <div class="p-4 rounded-xl border ${d ? 'bg-[#101114] border-[#242731]' : 'bg-white border-zinc-300 shadow-sm'}">
                  <div class="flex items-center justify-between mb-3">
                    <div>
                      <span class="text-xs font-semibold block ${d ? 'text-zinc-200' : 'text-zinc-800'}">Reference Files (TXT, PDF, Images)</span>
                      <span class="text-[10px] text-zinc-500">Attached files will be fully included when copying the prompt.</span>
                    </div>
                    <label class="px-3 py-1.5 rounded-lg bg-[#5E6AD2]/15 text-[#5E6AD2] text-xs font-medium cursor-pointer shrink-0 hover:bg-[#5E6AD2]/25 transition">
                      + Attach File
                      <input id="file-upload" type="file" multiple accept=".pdf,.txt,.md,.csv,image/*" class="hidden" />
                    </label>
                  </div>
                  <div class="space-y-2">
                    ${(active.attachments || []).map(a => `
                      <div class="p-2.5 rounded-lg border flex items-center justify-between gap-2 ${d ? 'bg-[#16181D] border-[#242731]' : 'bg-zinc-50 border-zinc-300'}">
                        <div class="flex items-center gap-2 truncate">
                          <i data-lucide="file-text" class="w-3.5 h-3.5 text-[#5E6AD2] shrink-0"></i>
                          <span class="text-xs truncate ${d ? 'text-zinc-200' : 'text-zinc-800'}">${esc(a.name)}</span>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                          ${a.extractedText ? `<button data-copy-att="${a.id}" class="btn-copy-att text-[11px] text-[#5E6AD2] hover:underline">Copy text</button>` : ''}
                          <button data-del-att="${a.id}" class="btn-del-att text-xs text-red-500 hover:text-red-700 font-bold px-1" title="Delete file">✕</button>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>
            ` : '<div class="flex-1 flex items-center justify-center text-xs text-zinc-500">Create or select a prompt from the sidebar</div>'}
          </main>
        </div>

        ${state.modal === 'ai' ? `
          <div id="modal-backdrop" class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
            <div class="w-full max-w-lg rounded-2xl border p-5 space-y-3 ${d ? 'bg-[#101114] border-[#242731] text-zinc-100' : 'bg-white border-zinc-300 text-zinc-900'}" onclick="event.stopPropagation()">
              <div class="flex justify-between items-center">
                <h3 class="text-sm font-semibold">AI Prompt Assistant</h3>
                <button id="close-modal" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200">✕</button>
              </div>
              <p class="text-xs text-zinc-500">Generate or improve prompts automatically with your configured API Key.</p>
              
              ${state.aiError ? `
                <div class="p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-500 text-xs">
                  ⚠️ <strong>AI Notice:</strong> ${esc(state.aiError)}
                </div>
              ` : ''}

              <textarea id="ai-input" rows="3" placeholder="Describe what you want to achieve with the prompt..." class="w-full p-3 rounded-xl border text-xs outline-none ${d ? 'bg-[#16181D] border-[#242731] text-zinc-100 placeholder-zinc-600' : 'bg-zinc-50 border-zinc-300 text-zinc-900 placeholder-zinc-400'}">${esc(state.aiInput)}</textarea>
              <button id="run-ai" class="w-full py-2.5 rounded-xl bg-[#5E6AD2] hover:bg-[#6E79E0] text-white text-xs font-medium transition">${state.aiLoading ? 'Connecting to AI...' : 'Generate Prompt with AI'}</button>
              
              ${state.aiOutput ? `
                <div>
                  <label class="block text-[11px] uppercase tracking-wider text-zinc-500 mb-1">Generated Result:</label>
                  <textarea id="ai-output" rows="6" class="w-full p-3 rounded-xl border font-mono text-xs ${d ? 'bg-[#16181D] border-[#242731] text-zinc-100' : 'bg-zinc-50 border-zinc-300 text-zinc-900'}">${esc(state.aiOutput)}</textarea>
                </div>
                <button id="save-ai" class="w-full py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium transition">Save to Library</button>
              ` : ''}
            </div>
          </div>
        ` : ''}

        ${state.modal === 'settings' ? `
          <div id="modal-backdrop" class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
            <div class="w-full max-w-md rounded-2xl border p-5 space-y-3 ${d ? 'bg-[#101114] border-[#242731] text-zinc-100' : 'bg-white border-zinc-300 text-zinc-900'}" onclick="event.stopPropagation()">
              <div class="flex justify-between items-center">
                <h3 class="text-sm font-semibold">API Keys Configuration</h3>
                <button id="close-modal" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200">✕</button>
              </div>
              <p class="text-xs text-zinc-500">Configure your provider and API key to enable the AI Prompt Assistant.</p>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">AI Provider</label>
                <select id="set-provider" class="w-full p-2.5 rounded-lg border text-xs outline-none ${d ? 'bg-[#16181D] border-[#242731] text-zinc-100' : 'bg-zinc-50 border-zinc-300 text-zinc-900'}">
                  <option value="gemini" ${state.apiKeys.provider === 'gemini' ? 'selected' : ''}>Google Gemini (Recommended)</option>
                  <option value="openai" ${state.apiKeys.provider === 'openai' ? 'selected' : ''}>OpenAI ChatGPT</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Google Gemini API Key</label>
                <input id="set-gemini" type="password" value="${esc(state.apiKeys.gemini)}" placeholder="AIzaSy..." class="w-full p-2.5 rounded-lg border text-xs outline-none ${d ? 'bg-[#16181D] border-[#242731] text-zinc-100 placeholder-zinc-600' : 'bg-zinc-50 border-zinc-300 text-zinc-900 placeholder-zinc-400'}" />
              </div>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">OpenAI API Key</label>
                <input id="set-openai" type="password" value="${esc(state.apiKeys.openai)}" placeholder="sk-..." class="w-full p-2.5 rounded-lg border text-xs outline-none ${d ? 'bg-[#16181D] border-[#242731] text-zinc-100 placeholder-zinc-600' : 'bg-zinc-50 border-zinc-300 text-zinc-900 placeholder-zinc-400'}" />
              </div>
              <button id="save-settings" class="w-full py-2.5 rounded-lg bg-[#5E6AD2] hover:bg-[#6E79E0] text-white text-xs font-medium transition">Save Configuration</button>
            </div>
          </div>
        ` : ''}

        ${state.modal === 'backup' ? `
          <div id="modal-backdrop" class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
            <div class="w-full max-w-md rounded-2xl border p-5 space-y-3 ${d ? 'bg-[#101114] border-[#242731] text-zinc-100' : 'bg-white border-zinc-300 text-zinc-900'}" onclick="event.stopPropagation()">
              <div class="flex justify-between items-center">
                <h3 class="text-sm font-semibold">Backup & Data</h3>
                <button id="close-modal" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200">✕</button>
              </div>
              <p class="text-xs text-zinc-500">Export or restore your prompt library and folders securely.</p>
              <button id="export-json" class="w-full py-2.5 rounded-lg bg-[#5E6AD2] hover:bg-[#6E79E0] text-white text-xs font-medium transition">Download JSON Backup</button>
              <label class="block w-full py-2.5 rounded-lg border text-center text-xs cursor-pointer transition ${d ? 'border-[#242731] hover:bg-zinc-800 text-zinc-300' : 'border-zinc-300 hover:bg-zinc-100 text-zinc-700'}">
                Restore from JSON File
                <input id="import-json" type="file" accept=".json" class="hidden" />
              </label>
            </div>
          </div>
        ` : ''}
      `;

      if (window.lucide) window.lucide.createIcons();
      bindEvents();
    }

    function bindEvents() {
      const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el[ev] = fn; };

      on('btn-mob-menu', 'onclick', () => { state.mobileTab = 'sidebar'; render(); });
      on('btn-close-sidebar', 'onclick', () => { state.mobileTab = 'list'; render(); });
      on('btn-back-list', 'onclick', () => { state.mobileTab = 'list'; render(); });
      on('btn-theme', 'onclick', () => { state.darkMode = !state.darkMode; save(); render(); });

      const editVaultName = () => {
        const newName = prompt('Edit your Vault name:', state.user.name);
        if (newName && newName.trim()) {
          state.user.name = newName.trim();
          save();
          render();
        }
      };
      on('vault-name-display', 'onclick', editVaultName);
      on('btn-edit-vault', 'onclick', editVaultName);

      document.querySelectorAll('.nav-view').forEach(el => {
        el.onclick = () => {
          state.activeView = el.getAttribute('data-view');
          state.mobileTab = 'list';
          render();
        };
      });

      on('btn-add-folder', 'onclick', () => {
        const name = prompt('New folder name:');
        if (name && name.trim()) {
          state.folders.push({ id: 'f-' + Date.now(), name: name.trim(), color: '#5E6AD2' });
          save();
          render();
        }
      });

      const createPrompt = () => {
        const folderId = (state.activeView !== 'all' && state.activeView !== 'favorites') ? state.activeView : state.folders[0].id;
        const p = {
          id: 'p-' + Date.now(),
          title: 'New Prompt',
          folderId,
          favorite: false,
          updatedAt: Date.now(),
          content: '',
          attachments: []
        };
        state.prompts.unshift(p);
        state.selectedPromptId = p.id;
        state.mobileTab = 'editor';
        save();
        render();
      };

      on('btn-new-prompt', 'onclick', createPrompt);
      on('btn-mob-new', 'onclick', createPrompt);

      on('search-input', 'oninput', (e) => {
        state.searchQuery = e.target.value;
        render();
        const inp = document.getElementById('search-input');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      });

      document.querySelectorAll('.prompt-card').forEach(el => {
        el.onclick = (e) => {
          if (e.target.classList.contains('btn-fav')) return;
          state.selectedPromptId = el.getAttribute('data-pid');
          state.mobileTab = 'editor';
          render();
        };
      });

      document.querySelectorAll('.btn-fav').forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const p = state.prompts.find(x => x.id === el.getAttribute('data-fav'));
          if (p) { p.favorite = !p.favorite; save(); render(); }
        };
      });

      const active = getActivePrompt();
      if (active) {
        on('edit-folder', 'onchange', (e) => { active.folderId = e.target.value; save(); render(); });
        on('edit-title', 'oninput', (e) => { active.title = e.target.value; save(); });
        on('edit-content', 'oninput', (e) => {
          const pos = e.target.selectionStart;
          active.content = e.target.value;
          save();
          render();
          const ta = document.getElementById('edit-content');
          if (ta) { ta.focus(); ta.setSelectionRange(pos, pos); }
        });

        document.querySelectorAll('.var-input').forEach(el => {
          el.oninput = (e) => {
            const v = el.getAttribute('data-var');
            state.varValues[v] = e.target.value;
            const prev = document.getElementById('compiled-preview');
            if (prev) prev.textContent = compilePrompt(active);
          };
        });

        on('btn-copy-final', 'onclick', () => copyText(compilePrompt(active), 'Prompt and files copied to clipboard'));
        on('btn-delete-prompt', 'onclick', () => {
          state.prompts = state.prompts.filter(x => x.id !== active.id);
          state.selectedPromptId = state.prompts[0]?.id || null;
          state.mobileTab = 'list';
          save();
          render();
        });

        on('file-upload', 'onchange', async (e) => {
          for (const file of Array.from(e.target.files || [])) {
            if (file.name.toLowerCase().endsWith('.pdf') && window.pdfjsLib) {
              try {
                const buf = await file.arrayBuffer();
                const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
                let txt = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                  const page = await pdf.getPage(i);
                  const c = await page.getTextContent();
                  txt += c.items.map(it => it.str).join(' ') + '\n';
                }
                active.attachments.push({ id: 'a-' + Date.now() + Math.random(), name: file.name, extractedText: txt.trim() });
              } catch {
                active.attachments.push({ id: 'a-' + Date.now() + Math.random(), name: file.name, extractedText: '[Attached PDF: ' + file.name + ']' });
              }
            } else if (file.type.startsWith('image/')) {
              active.attachments.push({ id: 'a-' + Date.now() + Math.random(), name: file.name, extractedText: '[Attached Image: ' + file.name + ']' });
            } else {
              try {
                const txt = await file.text();
                active.attachments.push({ id: 'a-' + Date.now() + Math.random(), name: file.name, extractedText: txt });
              } catch {
                active.attachments.push({ id: 'a-' + Date.now() + Math.random(), name: file.name, extractedText: '[Attached file: ' + file.name + ']' });
              }
            }
          }
          save();
          render();
          notify('Files read and attached successfully');
        });

        document.querySelectorAll('.btn-copy-att').forEach(el => {
          el.onclick = () => {
            const att = active.attachments.find(a => a.id === el.getAttribute('data-copy-att'));
            if (att?.extractedText) copyText(att.extractedText, 'File text copied');
          };
        });

        document.querySelectorAll('.btn-del-att').forEach(el => {
          el.onclick = () => {
            const attId = el.getAttribute('data-del-att');
            active.attachments = active.attachments.filter(a => a.id !== attId);
            save();
            render();
            notify('File deleted');
          };
        });
      }

      on('btn-open-ai', 'onclick', () => { state.modal = 'ai'; state.aiError = ''; render(); });
      on('btn-mob-ai', 'onclick', () => { state.modal = 'ai'; state.aiError = ''; render(); });
      on('btn-open-settings', 'onclick', () => { state.modal = 'settings'; render(); });
      on('btn-open-backup', 'onclick', () => { state.modal = 'backup'; render(); });
      on('modal-backdrop', 'onclick', () => { state.modal = null; render(); });
      on('close-modal', 'onclick', () => { state.modal = null; render(); });

      on('run-ai', 'onclick', async () => {
        state.aiInput = document.getElementById('ai-input')?.value || '';
        if (!state.aiInput.trim()) {
          state.aiError = 'Please write a description of what you want to create.';
          render();
          return;
        }

        const apiKey = state.apiKeys.provider === 'gemini' ? state.apiKeys.gemini : state.apiKeys.openai;
        if (!apiKey || !apiKey.trim()) {
          state.aiError = `No API Key configured for ${state.apiKeys.provider === 'gemini' ? 'Google Gemini' : 'OpenAI'}. Go to "Configure API Keys" in the sidebar to add it.`;
          render();
          return;
        }

        state.aiLoading = true;
        state.aiError = '';
        render();

        const promptInstr = 'Create a structured and professional prompt in English about: ' + state.aiInput;
        try {
          if (state.apiKeys.provider === 'gemini') {
            const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + apiKey.trim(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: promptInstr }] }] })
            });
            const data = await r.json();
            if (data.error) {
              throw new Error(data.error.message || 'Error in Gemini API (possible incorrect key or out of credits).');
            }
            state.aiOutput = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response received from AI.';
          } else {
            const r = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: { 
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + apiKey.trim()
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [{ role: 'user', content: promptInstr }]
              })
            });
            const data = await r.json();
            if (data.error) {
              throw new Error(data.error.message || 'Error in OpenAI API (check your credits or API Key).');
            }
            state.aiOutput = data.choices?.[0]?.message?.content || 'No response received from AI.';
          }
        } catch (err) {
          state.aiError = 'Connection or configuration error: ' + err.message;
        }
        state.aiLoading = false;
        render();
      });

      on('save-ai', 'onclick', () => {
        const text = document.getElementById('ai-output')?.value || state.aiOutput;
        const p = {
          id: 'p-' + Date.now(),
          title: (state.aiInput || 'AI Prompt').slice(0, 40),
          folderId: state.folders[0].id,
          favorite: false,
          updatedAt: Date.now(),
          content: text,
          attachments: []
        };
        state.prompts.unshift(p);
        state.selectedPromptId = p.id;
        state.modal = null;
        state.mobileTab = 'editor';
        save();
        render();
        notify('Prompt generated and saved');
      });

      on('save-settings', 'onclick', () => {
        state.apiKeys.provider = document.getElementById('set-provider').value;
        state.apiKeys.gemini = document.getElementById('set-gemini').value.trim();
        state.apiKeys.openai = document.getElementById('set-openai').value.trim();
        state.modal = null;
        save();
        render();
        notify('Keys and configuration saved');
      });

      on('export-json', 'onclick', () => {
        const blob = new Blob([JSON.stringify({ folders: state.folders, prompts: state.prompts }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'promptvault-backup.json';
        a.click();
      });

      on('import-json', 'onchange', async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        try {
          const data = JSON.parse(await f.text());
          if (data.prompts) state.prompts = data.prompts;
          if (data.folders) state.folders = data.folders;
          state.modal = null;
          save();
          render();
          notify('Library restored successfully');
        } catch {
          alert('Invalid JSON file.');
        }
      });
    }

    render();
  </script>
</body>
</html>
