<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PromptVault — Private AI Prompt Manager</title>
  <meta name="theme-color" content="#0B0C0E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; margin: 0; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(120, 125, 140, 0.3); border-radius: 999px; }
    #graph-3d-container { min-width: 0; min-height: 0; position: relative; overflow: hidden; }
    #graph-3d-container canvas { display: block; outline: none; }
    .graph-hint { pointer-events: none; }
    @media (max-width: 640px) {
      #node-inspector { max-height: 38vh; overflow-y: auto; }
    }
  </style>
</head>
<body class="bg-[#0B0C0E] text-zinc-100 antialiased selection:bg-[#5E6AD2]/30">
  <div id="app"></div>

  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const state = {
      darkMode: localStorage.getItem('pv_theme') !== 'light',
      user: JSON.parse(localStorage.getItem('pv_user') || 'null'),
      folders: JSON.parse(localStorage.getItem('pv_folders') || 'null') || [
        { id: 'f-general', name: 'General', color: '#5E6AD2' }
      ],
      prompts: JSON.parse(localStorage.getItem('pv_prompts') || 'null') || [],
      apiKeys: JSON.parse(localStorage.getItem('pv_apikeys') || '{"openai":"","anthropic":"","gemini":"","provider":"gemini"}'),
      activeView: 'all',
      selectedPromptId: null,
      mobileTab: 'list',
      mainMode: 'editor',
      searchQuery: '',
      varValues: {},
      modal: null,
      aiInput: '',
      aiOutput: '',
      aiLoading: false,
      aiError: '',
      inspectedNode: null
    };

    if (state.prompts.length > 0 && !state.selectedPromptId) {
      state.selectedPromptId = state.prompts[0].id;
    }

    function save() {
      localStorage.setItem('pv_theme', state.darkMode ? 'dark' : 'light');
      localStorage.setItem('pv_user', JSON.stringify(state.user));
      localStorage.setItem('pv_folders', JSON.stringify(state.folders));
      localStorage.setItem('pv_prompts', JSON.stringify(state.prompts));
      localStorage.setItem('pv_apikeys', JSON.stringify(state.apiKeys));
    }

    function notify(msg) {
      const el = document.createElement('div');
      el.className = 'fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-xl bg-[#5E6AD2] text-white text-xs font-medium shadow-xl';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    function esc(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getActivePrompt() {
      return state.prompts.find(p => p.id === state.selectedPromptId) || null;
    }

    function getVariables(text) {
      const matches = (text || '').match(/\{\{([^}]+)\}\}/g) || [];
      return [...new Set(matches.map(m => m.slice(2, -2).trim()).filter(Boolean))];
    }

    function compilePromptOnly(prompt) {
      if (!prompt) return '';
      let out = prompt.content || '';
      getVariables(out).forEach(v => {
        const val = state.varValues[v];
        if (val && val.trim()) {
          const safe = v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          out = out.replace(new RegExp('\\{\\{\\s*' + safe + '\\s*\\}\\}', 'g'), val);
        }
      });
      return out;
    }

    async function copyText(text, label = 'Copied prompt to clipboard') {
      try {
        await navigator.clipboard.writeText(text);
        notify(label);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        notify(label);
      }
    }

    function buildGraphData() {
      const nodes = [];
      const links = [];

      const visibleFolders = (state.activeView === 'all' || state.activeView === 'favorites')
        ? state.folders
        : state.folders.filter(f => f.id === state.activeView);

      visibleFolders.forEach(f => {
        nodes.push({
          id: f.id,
          name: f.name,
          type: 'folder',
          radius: 12,
          raw: f
        });
      });

      const visiblePrompts = state.prompts.filter(p => {
        if (state.activeView === 'favorites' && !p.favorite) return false;
        if (state.activeView !== 'all' && state.activeView !== 'favorites' && p.folderId !== state.activeView) return false;
        return true;
      });

      visiblePrompts.forEach(p => {
        nodes.push({
          id: p.id,
          name: p.title || 'Untitled Prompt',
          type: 'prompt',
          radius: 10,
          raw: p
        });

        if (visibleFolders.some(f => f.id === p.folderId)) {
          links.push({ source: p.folderId, target: p.id });
        }

        (p.attachments || []).forEach(att => {
          const isImg = att.isImage || (att.name && /\.(png|jpe?g|gif|webp|svg)$/i.test(att.name));
          nodes.push({
            id: att.id,
            name: att.name,
            type: isImg ? 'image' : 'file',
            radius: 9,
            raw: att,
            parentPrompt: p
          });
          links.push({ source: p.id, target: att.id });
        });
      });

      return { nodes, links };
    }

    // Canvas texture for the dark, glossy core of each 3D node.
    function createBlackSphereTexture(node) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const accent = node.type === 'folder' ? '#10B981' : node.type === 'prompt' ? '#818CF8' : node.type === 'image' ? '#EC4899' : '#F59E0B';
      const gradient = ctx.createRadialGradient(170, 80, 10, 256, 128, 270);
      gradient.addColorStop(0, '#34384A');
      gradient.addColorStop(.45, '#11131B');
      gradient.addColorStop(1, '#030407');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 512, 256);
      ctx.strokeStyle = accent;
      ctx.globalAlpha = .9;
      ctx.lineWidth = 12;
      ctx.strokeRect(7, 7, 498, 242);
      ctx.globalAlpha = 1;
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    // A camera-facing 3D card keeps names, snippets and image previews readable.
    function createNodeCardTexture(node) {
      const canvas = document.createElement('canvas');
      canvas.width = 900;
      canvas.height = 440;
      const ctx = canvas.getContext('2d');
      const accent = node.type === 'folder' ? '#10B981' : node.type === 'prompt' ? '#818CF8' : node.type === 'image' ? '#EC4899' : '#F59E0B';
      const roundRect = (x, y, w, h, r) => {
        ctx.beginPath();
        ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
      };
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      roundRect(8, 8, 884, 424, 34);
      ctx.fillStyle = 'rgba(9, 11, 18, .96)'; ctx.fill();
      ctx.strokeStyle = accent; ctx.lineWidth = 8; ctx.stroke();
      roundRect(34, 32, 210, 48, 18); ctx.fillStyle = accent; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '700 25px Inter, sans-serif';
      const category = ({folder:'CARPETA', prompt:'PROMPT', image:'IMAGEN', file:'ARCHIVO'})[node.type] || 'ELEMENTO';
      ctx.fillText(category, 52, 64);

      const title = String(node.name || 'Sin título');
      ctx.fillStyle = '#FFFFFF'; ctx.font = '700 42px Inter, sans-serif';
      let titleLine = title;
      while (ctx.measureText(titleLine).width > 810 && titleLine.length > 8) titleLine = titleLine.slice(0, -2);
      if (titleLine !== title) titleLine += '…';
      ctx.fillText(titleLine, 36, 145);
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(36, 170); ctx.lineTo(864, 170); ctx.stroke();

      if (node.type === 'image' && node.raw?.dataUrl) {
        const img = new Image();
        img.onload = () => {
          const x = 36, y = 192, w = 828, h = 210;
          const scale = Math.max(w / img.width, h / img.height);
          const sw = w / scale, sh = h / scale;
          const sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
          ctx.save(); roundRect(x, y, w, h, 18); ctx.clip();
          ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h); ctx.restore();
          texture.needsUpdate = true;
        };
        img.src = node.raw.dataUrl;
      } else {
        let body = node.type === 'folder'
          ? `${state.prompts.filter(p => p.folderId === node.id).length} prompts en esta carpeta`
          : node.type === 'prompt'
            ? compilePromptOnly(node.raw) || 'Prompt vacío'
            : node.raw?.extractedText || 'No hay texto extraído de este archivo';
        body = String(body).replace(/\s+/g, ' ').trim();
        ctx.fillStyle = '#D7DCE8'; ctx.font = '25px JetBrains Mono, monospace';
        const words = body.split(' '); let line = ''; let y = 222; let count = 0;
        for (const word of words) {
          const test = line ? `${line} ${word}` : word;
          if (ctx.measureText(test).width > 820 && line) {
            ctx.fillText(line, 38, y); line = word; y += 43; count++;
            if (count >= 4) break;
          } else line = test;
        }
        if (count < 5 && line) ctx.fillText(line, 38, y);
        if (words.length > 30 || count >= 4) {
          ctx.fillStyle = accent; ctx.font = '700 22px Inter, sans-serif';
          ctx.fillText('VISTA PREVIA · SELECCIONA PARA VER TODO', 38, 397);
        }
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    function createNodeObject(node) {
      const group = new THREE.Group();
      const accent = node.type === 'folder' ? '#10B981' : node.type === 'prompt' ? '#818CF8' : node.type === 'image' ? '#EC4899' : '#F59E0B';
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(node.radius, 48, 48),
        new THREE.MeshPhysicalMaterial({
          map: createBlackSphereTexture(node), color: '#FFFFFF', metalness: .48,
          roughness: .2, clearcoat: 1, clearcoatRoughness: .12,
          emissive: new THREE.Color(accent), emissiveIntensity: .22
        })
      );
      sphere.rotation.y = -Math.PI / 2;
      group.add(sphere);

      const halo = new THREE.Mesh(
        new THREE.TorusGeometry(node.radius + 1.8, .55, 12, 72),
        new THREE.MeshBasicMaterial({ color: accent, transparent: true, opacity: .78 })
      );
      halo.rotation.x = Math.PI / 2.7;
      group.add(halo);

      const card = new THREE.Sprite(new THREE.SpriteMaterial({
        map: createNodeCardTexture(node), transparent: true, depthWrite: false,
        depthTest: false, sizeAttenuation: true
      }));
      card.scale.set(48, 23.5, 1);
      card.position.set(0, node.radius + 17, 0);
      group.add(card);
      group.userData.card = card;
      return group;
    }

    let graphInstance = null;

    function init3DGraph() {
      const container = document.getElementById('graph-3d-container');
      if (!container || !window.ForceGraph3D || !window.THREE) return;
      if (graphInstance && typeof graphInstance._destructor === 'function') {
        try { graphInstance._destructor(); } catch (_) {}
      }
      graphInstance = null;
      container.innerHTML = '';
      const data = buildGraphData();
      const d = state.darkMode;
      if (!data.nodes.length) {
        container.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-center p-8 text-zinc-500"><div><div class="text-lg font-semibold mb-2">Tu espacio 3D está vacío</div><div class="text-sm">Crea un prompt o una carpeta y aparecerá aquí.</div></div></div>';
        return;
      }

      graphInstance = ForceGraph3D()(container)
        .width(Math.max(container.clientWidth, 320))
        .height(Math.max(container.clientHeight, 320))
        .backgroundColor(d ? '#080A10' : '#E9ECF4')
        .showNavInfo(true)
        .enableNodeDrag(true)
        .enableNavigationControls(true)
        .graphData(data)
        .nodeLabel(node => `${node.type.toUpperCase()}: ${node.name}`)
        .nodeThreeObject(node => createNodeObject(node))
        .nodeThreeObjectExtend(false)
        .linkColor(() => d ? 'rgba(148,163,184,.48)' : 'rgba(71,85,105,.42)')
        .linkWidth(1.35)
        .linkDistance(78)
        .linkOpacity(.72)
        .linkDirectionalParticles(3)
        .linkDirectionalParticleWidth(2.4)
        .linkDirectionalParticleSpeed(.004)
        .onNodeHover(node => { container.style.cursor = node ? 'pointer' : 'grab'; })
        .onNodeClick(node => {
          state.inspectedNode = node;
          renderInspector();
          const distance = 85;
          const length = Math.hypot(node.x || 1, node.y || 1, node.z || 1) || 1;
          const distRatio = 1 + distance / length;
          graphInstance.cameraPosition(
            { x: (node.x || 0) * distRatio, y: (node.y || 0) * distRatio, z: (node.z || 0) * distRatio },
            node, 900
          );
        });

      const scene = graphInstance.scene();
      scene.add(new THREE.AmbientLight(0xffffff, 1.35));
      const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
      keyLight.position.set(90, 120, 100); scene.add(keyLight);
      const rimLight = new THREE.PointLight(0x6366f1, 1.8, 500);
      rimLight.position.set(-100, 40, -80); scene.add(rimLight);
      graphInstance.cameraPosition({ x: 0, y: 0, z: 190 }, { x: 0, y: 0, z: 0 }, 0);
    }

    function renderInspector() {
      const box = document.getElementById('node-inspector');
      if (!box) return;
      const node = state.inspectedNode;
      const d = state.darkMode;
      if (!node) {
        box.innerHTML = `
          <div class="text-xs text-zinc-500">
            Selecciona una esfera para ver, editar o copiar su contenido completo.
          </div>`;
        return;
      }

      let bodyHtml = '';
      if (node.type === 'folder') {
        const count = state.prompts.filter(p => p.folderId === node.id).length;
        bodyHtml = `<p class="text-xs text-zinc-400">Folder containing <strong>${count}</strong> prompt(s).</p>`;
      } else if (node.type === 'prompt') {
        bodyHtml = `
          <div class="space-y-2.5">
            <pre class="p-2.5 rounded-lg border font-mono text-[11px] max-h-48 overflow-y-auto whitespace-pre-wrap ${d ? 'bg-[#16181D] border-[#242731] text-zinc-200' : 'bg-zinc-50 border-zinc-300 text-zinc-800'}">${esc(compilePromptOnly(node.raw) || 'Empty prompt')}</pre>
            <div class="flex gap-2">
              <button id="insp-copy-prompt" class="flex-1 py-1.5 px-2.5 rounded-lg bg-[#5E6AD2] text-white text-xs font-medium">Copy prompt</button>
              <button id="insp-open-editor" class="py-1.5 px-2.5 rounded-lg border text-xs ${d ? 'border-[#242731] text-zinc-300' : 'border-zinc-300 text-zinc-700'}">Edit</button>
            </div>
          </div>`;
      } else if (node.type === 'image') {
        bodyHtml = `
          <div class="space-y-2.5">
            ${node.raw.dataUrl ? `<img src="${node.raw.dataUrl}" class="w-full max-h-48 object-contain rounded-lg border ${d ? 'border-[#242731]' : 'border-zinc-300'}" />` : '<p class="text-xs text-zinc-400">Image preview unavailable.</p>'}
            <p class="text-[11px] text-zinc-400">Linked to: <strong>${esc(node.parentPrompt?.title || '')}</strong></p>
          </div>`;
      } else {
        bodyHtml = `
          <div class="space-y-2.5">
            <pre class="p-2.5 rounded-lg border font-mono text-[11px] max-h-48 overflow-y-auto whitespace-pre-wrap ${d ? 'bg-[#16181D] border-[#242731] text-zinc-200' : 'bg-zinc-50 border-zinc-300 text-zinc-800'}">${esc(node.raw.extractedText || 'No text content')}</pre>
            <button id="insp-copy-file" class="w-full py-1.5 px-2.5 rounded-lg bg-[#5E6AD2] text-white text-xs font-medium">Copy file text</button>
          </div>`;
      }

      box.innerHTML = `
        <div class="space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <span class="inline-flex items-center gap-1.5 text-xs font-semibold">
              <span class="w-2.5 h-2.5 rounded-full bg-black border border-zinc-500"></span>
              ${esc(node.name)}
            </span>
            <button id="insp-close" class="text-xs text-zinc-400 hover:text-zinc-200">✕</button>
          </div>
          ${bodyHtml}
        </div>`;

      const closeBtn = document.getElementById('insp-close');
      if (closeBtn) closeBtn.onclick = () => { state.inspectedNode = null; renderInspector(); };

      const copyP = document.getElementById('insp-copy-prompt');
      if (copyP) copyP.onclick = () => copyText(compilePromptOnly(node.raw), 'Prompt copied');

      const openEd = document.getElementById('insp-open-editor');
      if (openEd) openEd.onclick = () => {
        state.selectedPromptId = node.raw.id;
        state.mainMode = 'editor';
        state.mobileTab = 'editor';
        render();
      };

      const copyF = document.getElementById('insp-copy-file');
      if (copyF) copyF.onclick = () => copyText(node.raw.extractedText || '', 'File text copied');
    }

    function render() {
      document.documentElement.classList.toggle('dark', state.darkMode);
      const app = document.getElementById('app');
      const d = state.darkMode;

      if (!state.user) {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 ${d ? 'bg-[#0B0C0E] text-zinc-100' : 'bg-[#F4F4F5] text-zinc-900'}">
            <div class="w-full max-w-md rounded-2xl border p-7 shadow-2xl ${d ? 'bg-[#101114] border-[#242731]' : 'bg-white border-zinc-200'}">
              <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-[#5E6AD2] flex items-center justify-center text-white font-bold">PV</div>
                <div>
                  <h1 class="text-lg font-semibold">PromptVault</h1>
                  <p class="text-xs text-zinc-500">Private AI Prompt Vault</p>
                </div>
              </div>
              <form id="login-form" class="space-y-4">
                <div>
                  <label class="block text-xs font-medium text-zinc-500 mb-1">Vault / Workspace Name</label>
                  <input id="login-name" type="text" placeholder="My Personal Vault" class="w-full px-3.5 py-2.5 rounded-lg border text-sm outline-none ${d ? 'bg-[#16181D] border-[#242731] text-zinc-100 placeholder-zinc-600' : 'bg-zinc-50 border-zinc-300 text-zinc-900 placeholder-zinc-400'}" />
                </div>
                <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-[#5E6AD2] hover:bg-[#6E79E0] text-white font-medium text-sm transition">
                  Enter Vault
                </button>
              </form>
            </div>
          </div>`;
        document.getElementById('login-form').onsubmit = (e) => {
          e.preventDefault();
          const name = document.getElementById('login-name').value.trim() || 'My Vault';
          state.user = { name };
          save();
          render();
        };
        return;
      }

      const filtered = state.prompts.filter(p => {
        if (state.activeView === 'favorites' && !p.favorite) return false;
        if (state.activeView !== 'all' && state.activeView !== 'favorites' && p.folderId !== state.activeView) return false;
        if (state.searchQuery.trim()) {
          const q = state.searchQuery.toLowerCase();
          return (p.title || '').toLowerCase().includes(q) || (p.content || '').toLowerCase().includes(q);
        }
        return true;
      });

      const active = getActivePrompt();
      const vars = active ? getVariables(active.content) : [];
      const compiledOnly = compilePromptOnly(active);

      app.innerHTML = `
        <div class="h-screen w-screen flex flex-col md:flex-row overflow-hidden ${d ? 'bg-[#0B0C0E] text-zinc-100' : 'bg-[#F4F4F5] text-zinc-900'}">
          
          <div class="md:hidden flex items-center justify-between px-4 py-3 border-b ${d ? 'bg-[#101114] border-[#242731]' : 'bg-white border-zinc-200'}">
            <div class="flex items-center gap-2 min-w-0">
              <button id="btn-mob-menu" class="p-1.5 rounded-lg border ${d ? 'border-[#242731] text-zinc-300' : 'border-zinc-300 text-zinc-700'}">
                <i data-lucide="menu" class="w-4 h-4"></i>
              </button>
              <span class="font-semibold text-sm truncate max-w-[130px]">${esc(state.user.name)}</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button id="btn-mob-graph" class="px-2.5 py-1.5 rounded-lg border text-xs font-medium ${state.mainMode === 'graph' ? 'bg-[#5E6AD2] text-white border-[#5E6AD2]' : (d ? 'border-[#242731] text-zinc-300' : 'border-zinc-300 text-zinc-700')}">3D</button>
              <button id="btn-mob-ai" class="px-2.5 py-1.5 rounded-lg bg-[#5E6AD2] text-white text-xs font-medium">AI</button>
              <button id="btn-mob-new" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-medium">+ New</button>
            </div>
          </div>

          <aside class="${state.mobileTab === 'sidebar' ? 'flex fixed inset-0 z-40' : 'hidden'} md:flex md:static w-full md:w-64 flex-col border-r shrink-0 ${d ? 'bg-[#101114] border-[#242731]' : 'bg-[#EAEAE6] border-zinc-300'}">
            <div class="p-4 flex items-center justify-between border-b ${d ? 'border-[#242731]' : 'border-zinc-300'}">
              <div class="flex items-center gap-2 min-w-0">
                <div class="w-7 h-7 rounded-lg bg-[#5E6AD2] flex items-center justify-center text-white text-xs font-bold shrink-0">PV</div>
                <div class="min-w-0 flex items-center gap-1.5">

          folderId,
          favorite: false,
          updatedAt: Date.now(),
          content: '',
          attachments: []
        };
        state.prompts.unshift(p);
        state.selectedPromptId = p.id;
        state.mainMode = 'editor';
        state.mobileTab = 'editor';
        save();
        render();
      };

      on('btn-new-prompt', 'onclick', createPrompt);
      on('btn-mob-new', 'onclick', createPrompt);

      on('search-input', 'oninput', (e) => {
        state.searchQuery = e.target.value;
        render();
        const inp = document.getElementById('search-input');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      });

        el.onclick = (e) => {
          if (e.target.classList.contains('btn-fav')) return;
          state.selectedPromptId = el.getAttribute('data-pid');
          state.mobileTab = 'editor';
          render();
        };
      });

      document.querySelectorAll('.btn-fav').forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const p = state.prompts.find(x => x.id === el.getAttribute('data-fav'));
          if (p) { p.favorite = !p.favorite; save(); render(); }
        };
      });

      const active = getActivePrompt();
      if (active) {
        on('edit-folder', 'onchange', (e) => { active.folderId = e.target.value; save(); render(); });
        on('edit-title', 'oninput', (e) => { active.title = e.target.value; save(); });
        on('edit-content', 'oninput', (e) => {
          const pos = e.target.selectionStart;
          active.content = e.target.value;
          save();
          render();
          const ta = document.getElementById('edit-content');
          if (ta) { ta.focus(); ta.setSelectionRange(pos, pos); }
        });

        document.querySelectorAll('.var-input').forEach(el => {
          el.oninput = (e) => {
            const v = el.getAttribute('data-var');
            state.varValues[v] = e.target.value;
            const prev = document.getElementById('compiled-preview');
            if (prev) prev.textContent = compilePromptOnly(active);
          };
        });

        on('btn-copy-final', 'onclick', () => copyText(compilePromptOnly(active), 'Prompt copied to clipboard'));
        on('btn-delete-prompt', 'onclick', () => {
          state.prompts = state.prompts.filter(x => x.id !== active.id);
          state.selectedPromptId = state.prompts[0]?.id || null;
          state.mobileTab = 'list';
          save();
          render();
        });

        on('file-upload', 'onchange', async (e) => {
          for (const file of Array.from(e.target.files || [])) {
            if (file.name.toLowerCase().endsWith('.pdf') && window.pdfjsLib) {
              try {
                const buf = await file.arrayBuffer();
                const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
                let txt = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                  const page = await pdf.getPage(i);
                  const c = await page.getTextContent();
                  txt += c.items.map(it => it.str).join(' ') + '\n';
                }
                active.attachments.push({ id: 'a-' + Date.now() + Math.random(), name: file.name, isImage: false, extractedText: txt.trim() });
              } catch {
                active.attachments.push({ id: 'a-' + Date.now() + Math.random(), name: file.name, isImage: false, extractedText: '[Attached PDF: ' + file.name + ']' });
              }
            } else if (file.type.startsWith('image/')) {
              const dataUrl = await new Promise(res => {
                const reader = new FileReader();
                reader.onload = () => res(reader.result);
                reader.readAsDataURL(file);
              });
              active.attachments.push({ id: 'a-' + Date.now() + Math.random(), name: file.name, isImage: true, dataUrl, extractedText: '' });
            } else {
              try {
                const txt = await file.text();
                active.attachments.push({ id: 'a-' + Date.now() + Math.random(), name: file.name, isImage: false, extractedText: txt });
              } catch {
                active.attachments.push({ id: 'a-' + Date.now() + Math.random(), name: file.name, isImage: false, extractedText: '[Attached file: ' + file.name + ']' });
              }
            }
          }
          save();
          render();
          notify('Files attached');
        });

        document.querySelectorAll('.btn-copy-att').forEach(el => {
          el.onclick = () => {
            const att = active.attachments.find(a => a.id === el.getAttribute('data-copy-att'));
            if (att?.extractedText) copyText(att.extractedText, 'File text copied');
          };
        });

        document.querySelectorAll('.btn-del-att').forEach(el => {
          el.onclick = () => {
            const attId = el.getAttribute('data-del-att');
            active.attachments = active.attachments.filter(a => a.id !== attId);
            save();
            render();
            notify('File deleted');
          };
        });
      }

      on('btn-open-ai', 'onclick', () => { state.modal = 'ai'; state.aiError = ''; render(); });
      on('btn-mob-ai', 'onclick', () => { state.modal = 'ai'; state.aiError = ''; render(); });
      on('btn-open-settings', 'onclick', () => { state.modal = 'settings'; render(); });
      on('btn-open-backup', 'onclick', () => { state.modal = 'backup'; render(); });
      on('modal-backdrop', 'onclick', () => { state.modal = null; render(); });
      on('close-modal', 'onclick', () => { state.modal = null; render(); });

      on('run-ai', 'onclick', async () => {
        state.aiInput = document.getElementById('ai-input')?.value || '';
        if (!state.aiInput.trim()) {
          state.aiError = 'Please write a description of what you want to create.';
          render();
          return;
        }

        const apiKey = state.apiKeys.provider === 'gemini' ? state.apiKeys.gemini : state.apiKeys.openai;
        if (!apiKey || !apiKey.trim()) {
          state.aiError = `No API Key configured for ${state.apiKeys.provider === 'gemini' ? 'Google Gemini' : 'OpenAI'}. Go to "Configure API Keys" in the sidebar to add it.`;
          render();
          return;
        }

        state.aiLoading = true;
        state.aiError = '';
        render();

        const promptInstr = 'Create a structured and professional prompt in English about: ' + state.aiInput;
        try {
          if (state.apiKeys.provider === 'gemini') {
            const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + apiKey.trim(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: promptInstr }] }] })
            });
            const data = await r.json();
            if (data.error) {
              throw new Error(data.error.message || 'Error in Gemini API (possible incorrect key or out of credits).');
            }
            state.aiOutput = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response received from AI.';
          } else {
            const r = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: { 
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + apiKey.trim()
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [{ role: 'user', content: promptInstr }]
              })
            });
            const data = await r.json();
            if (data.error) {
              throw new Error(data.error.message || 'Error in OpenAI API (check your credits or API Key).');
            }
            state.aiOutput = data.choices?.[0]?.message?.content || 'No response received from AI.';
          }
        } catch (err) {
          state.aiError = 'Connection or configuration error: ' + err.message;
        }
        state.aiLoading = false;
        render();
      });

      on('save-ai', 'onclick', () => {
        const text = document.getElementById('ai-output')?.value || state.aiOutput;
        const p = {
          id: 'p-' + Date.now(),
          title: (state.aiInput || 'AI Prompt').slice(0, 40),
          folderId: state.folders[0]?.id || 'f-general',
          favorite: false,
          updatedAt: Date.now(),
          content: text,
          attachments: []
        };
        state.prompts.unshift(p);
        state.selectedPromptId = p.id;
        state.modal = null;
        state.mainMode = 'editor';
        state.mobileTab = 'editor';
        save();
        render();
        notify('Prompt generated and saved');
      });

      on('save-settings', 'onclick', () => {
        state.apiKeys.provider = document.getElementById('set-provider').value;
        state.apiKeys.gemini = document.getElementById('set-gemini').value.trim();
        state.apiKeys.openai = document.getElementById('set-openai').value.trim();
        state.modal = null;
        save();
        render();
        notify('Keys and configuration saved');
      });

      on('export-json', 'onclick', () => {
        const blob = new Blob([JSON.stringify({ folders: state.folders, prompts: state.prompts }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'promptvault-backup.json';
        a.click();
      });

      on('import-json', 'onchange', async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        try {
          const data = JSON.parse(await f.text());
          if (data.prompts) state.prompts = data.prompts;
          if (data.folders) state.folders = data.folders;
          state.modal = null;
          save();
          render();
          notify('Library restored successfully');
        } catch {
          alert('Invalid JSON file.');
        }
      });
    }

    window.addEventListener('resize', () => {
      if (state.mainMode === 'graph' && graphInstance) {
        const container = document.getElementById('graph-3d-container');
        if (container && container.clientWidth && container.clientHeight) {
          graphInstance.width(container.clientWidth).height(container.clientHeight);
        }
      }
    });

    render();
  </script>
</body>
</html>
